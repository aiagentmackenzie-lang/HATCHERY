[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hatchery"
version = "0.1.0"
description = "Docker-based malware sandbox engine — watch it hatch, watch it burn."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Raphael Main + Agent Mackenzie"},
]

dependencies = [
    "click>=8.1",
    "rich>=13.9",
    "docker>=7.0",
    "pefile>=2024.0.0",
    "pyelftools>=0.32",
    "yara-x>=1.16",
    "flare-capa>=9.0",
    "aiofiles>=24.1",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.15",
    "mypy>=1.10",
    # Test-only fixture builders and cross-checks: real LNK / ISO9660 / PDF bytes
    # written by an independent implementation, and an independent CFB reader
    # (olefile) plus MS-OVBA/VBA and RTF OLE-object extractors (oletools) so the
    # OLE/RTF fixtures cannot be validated against HATCHERY's own writer. The
    # runtime stays stdlib.
    "pylnk3>=0.4.3",
    "pycdlib>=1.22.0",
    "pypdf>=6.0",
    "olefile>=0.47",
    "oletools>=0.60",
]

[tool.ruff.lint]
# Pin the rule set explicitly (ruff 0.16 changed the default `select` from
# E4/E7/E9/F to a much broader set, which would fail CI on every push).
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "engine.fake_services.*"
disable_error_code = ["attr-defined", "assignment", "var-annotated", "union-attr"]

[[tool.mypy.overrides]]
module = "engine.static.yara_scanner"
disable_error_code = ["attr-defined"]

[project.scripts]
hatchery = "engine.cli:cli"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = [
    "static/rules/**/*.yar",
    "sandbox/seccomp.json",
    "sandbox/docker/*",
    "export/attack/*.json",
    "export/ocsf/*.json",
]