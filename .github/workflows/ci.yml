name: HATCHERY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check engine/ tests/

      - name: Type check with mypy
        run: mypy engine/

      - name: Lint the YARA rules
        run: hatchery rules lint

      - name: Test with pytest
        run: pytest -q

  # Opt-in and non-required until it has proven stable. It installs the beta
  # emulator extra (which the pinned python-gate deliberately never installs) and
  # runs the emulation tests. It does NOT build the emulation image or run the
  # container E2E — that stays behind HATCHERY_EMULATION_E2E.
  emulation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the emulation extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,emulation]"

      - name: Confirm the pinned emulator imported
        run: python -c "import speakeasy, unicorn; print('speakeasy ok, unicorn', unicorn.__version__)"

      - name: Emulation unit tests
        run: pytest tests/test_emulate_report.py tests/test_emulate_config.py tests/test_emulate_memory.py tests/test_emulate_runner.py tests/test_emulate_negative.py -q

  # Really detonates a sample in a container. This is the job that would have
  # caught every blocker the project shipped with: the sandbox network was never
  # created, artifact paths were wrong, seccomp blocked its own tracer, the exit
  # code was always zero, and no behavioral data reached the API.
  detonation-gate:
    runs-on: ubuntu-latest
    needs: python-gate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Report host isolation capability
        run: hatchery doctor

      - name: Build the sandbox image
        run: hatchery build

      - name: End-to-end detonation test
        env:
          HATCHERY_E2E: '1'
        run: pytest tests/test_dynamic_e2e.py -v

  server-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Type check server
        working-directory: ./server
        run: npm run typecheck

      - name: Build server
        working-directory: ./server
        run: npm run build

      - name: Unit-test the process-tree parser
        working-directory: ./server
        run: npm test

      # The built server used to fail at startup because tsc does not copy
      # schema.sql. Prove it actually boots.
      - name: Smoke test the built server
        working-directory: ./server
        run: |
          node dist/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3002/api/health > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3002/api/health
          kill $SERVER_PID

  dashboard-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: ./dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: ./dashboard
        run: npm run build
