name: HATCHERY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The workflow was disabled manually once (2026-11-24) and every push went
  # ungated without a word. A dispatch entry means an operator can re-run the
  # gates on demand instead of pushing a dummy commit to find out.
  workflow_dispatch:

jobs:
  python-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check engine/ tests/

      - name: Type check with mypy
        run: mypy engine/

      - name: Lint the YARA rules
        run: hatchery rules lint

      - name: Test with pytest
        run: pytest -q

      # Deterministic acceptance inputs: the manifest must regenerate
      # byte-identically, and recorded outcomes must match (known defects are
      # reported but do not fail this gate).
      - name: Verify acceptance fixtures
        run: |
          python tests/fixtures/acceptance/tools/generate_fixtures.py --check
          python scripts/verify_fixtures.py

  # D39: hostile input is incomplete work, not a traceback. A job of its own so
  # the corpus, the stage isolation rows and the parser properties are a gate
  # rather than a line in a 900-test suite: the first step proves hypothesis is
  # installed, so the property module's `importorskip` cannot turn the gate into
  # a green skip when someone edits the extra.
  hostile-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: The property-test dependency is installed (a skip is not a pass)
        run: python -c "import hypothesis; print('hypothesis', hypothesis.__version__)"

      - name: Hostile corpus, stage isolation and parser properties
        run: |
          pytest tests/test_hostile_inputs.py tests/test_stage_isolation.py \
                 tests/test_parser_properties.py -q -o addopts=""

  # Opt-in and non-required until it has proven stable. It installs the beta
  # emulator extra (which the pinned python-gate deliberately never installs) and
  # runs the emulation tests. It does NOT build the emulation image or run the
  # container E2E — that stays behind HATCHERY_EMULATION_E2E.
  emulation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the emulation extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,emulation]"

      - name: Confirm the pinned emulator imported
        run: python -c "import speakeasy, unicorn; print('speakeasy ok, unicorn', unicorn.__version__)"

      - name: Emulation unit tests
        run: pytest tests/test_emulate_report.py tests/test_emulate_config.py tests/test_emulate_memory.py tests/test_emulate_runner.py tests/test_emulate_negative.py -q

  # Really detonates a sample in a container. This is the job that would have
  # caught every blocker the project shipped with: the sandbox network was never
  # created, artifact paths were wrong, seccomp blocked its own tracer, the exit
  # code was always zero, and no behavioral data reached the API.
  detonation-gate:
    runs-on: ubuntu-latest
    needs: python-gate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Report host isolation capability
        run: hatchery doctor

      - name: Build the sandbox image
        run: hatchery build

      - name: End-to-end detonation test
        env:
          HATCHERY_E2E: '1'
        run: pytest tests/test_dynamic_e2e.py -v

  server-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Type check server
        working-directory: ./server
        run: npm run typecheck

      - name: Build server
        working-directory: ./server
        run: npm run build

      - name: Unit-test the process-tree parser
        working-directory: ./server
        run: npm test

      # The built server used to fail at startup because tsc does not copy
      # schema.sql. Prove it actually boots.
      - name: Smoke test the built server
        working-directory: ./server
        run: |
          node dist/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3002/api/health > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3002/api/health
          kill $SERVER_PID

  # The queue is a cross-language contract: the API enqueues through the engine
  # CLI, and a worker executes the engine pipeline. This job is the only one with
  # both runtimes installed, so it is where the server<->queue integration test
  # actually runs (server-gate has no engine and skips it with a reason).
  queue-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Build server
        working-directory: ./server
        run: npm run build

      - name: Queue database migration and end-to-end tests
        working-directory: ./server
        env:
          HATCHERY_ENGINE_PYTHON: python3
        run: node --test test/queue_e2e.test.mjs test/queue_migration.test.mjs

  dashboard-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: ./dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: ./dashboard
        run: npm run build
